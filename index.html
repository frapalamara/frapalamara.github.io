<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>SUDOKUBE</title>
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">

  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.158.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.158.0/examples/jsm/"
    }
  }
  </script>

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    /* ── CRT scanlines ── */
    body::after {
      content: '';
      position: fixed;
      inset: 0;
      background: repeating-linear-gradient(
        to bottom,
        transparent 0px, transparent 3px,
        rgba(0,0,0,0.18) 3px, rgba(0,0,0,0.18) 4px
      );
      pointer-events: none;
      z-index: 999;
    }

    body {
      background: #050a0e;
      color: #e8f4e8;
      font-family: 'Press Start 2P', monospace;
      overflow: hidden;
      height: 100dvh;
      user-select: none;
      -webkit-user-select: none;
    }

    #container { position: fixed; inset: 0; }
    #container canvas { display: block; }

    /* ── CRT edge glow ── */
    #container::before {
      content: '';
      position: fixed;
      inset: 0;
      box-shadow: inset 0 0 80px rgba(0,255,100,0.04), inset 0 0 3px rgba(0,255,100,0.12);
      pointer-events: none;
      z-index: 5;
    }

    /* ── info hint ── */
    #info {
      position: fixed;
      top: 12px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 20;
      font-size: 6px;
      color: #1e4d30;
      pointer-events: none;
      text-align: center;
      letter-spacing: 1px;
      white-space: nowrap;
    }

    /* ── bottom UI panel ── */
    #ui {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      z-index: 20;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 0 12px 14px;
      gap: 8px;
      background: linear-gradient(to top, rgba(5,10,14,0.98) 80%, transparent);
      border-top: 2px solid #0a2a18;
      pointer-events: none;
    }

    #ui > * { pointer-events: all; }

    /* top bar */
    #top-bar {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
      justify-content: center;
      padding-top: 10px;
    }

    .title {
      font-size: 13px;
      color: #00ff66;
      letter-spacing: 3px;
      text-transform: uppercase;
      text-shadow: 0 0 8px #00ff66, 0 0 20px rgba(0,255,100,0.4), 2px 2px 0 #002200;
      animation: titleFlicker 5s infinite;
    }

    @keyframes titleFlicker {
      0%,94%,100% { opacity: 1; }
      95% { opacity: 0.8; }
      97% { opacity: 1; }
      98% { opacity: 0.85; }
    }

    select, button {
      background: #060e0a;
      border: 2px solid #144d28;
      color: #00bb55;
      padding: 6px 10px;
      font-size: 7px;
      font-family: 'Press Start 2P', monospace;
      cursor: pointer;
      outline: none;
      border-radius: 0;
      text-transform: uppercase;
      box-shadow: 3px 3px 0 #001a0d;
      transition: none;
    }

    select:hover, button:hover {
      background: #091a10;
      border-color: #00ff66;
      color: #00ff66;
      box-shadow: 3px 3px 0 #003311, 0 0 8px rgba(0,255,100,0.15);
    }

    button:active {
      transform: translate(2px, 2px);
      box-shadow: 1px 1px 0 #001a0d;
    }

    #btn-new {
      background: #002a10;
      border-color: #00ff66;
      color: #00ff66;
      padding: 7px 14px;
      box-shadow: 3px 3px 0 #001a0d, 0 0 10px rgba(0,255,100,0.2);
    }
    #btn-new:hover { background: #004020; box-shadow: 3px 3px 0 #002a10, 0 0 16px rgba(0,255,100,0.4); }

    /* controls row */
    #ctrls {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      justify-content: center;
      align-items: center;
    }

    .grp {
      display: flex;
      align-items: center;
      gap: 4px;
      background: #060e0a;
      border: 2px solid #0d2e1a;
      padding: 6px 8px;
      box-shadow: inset 0 0 10px rgba(0,0,0,0.5);
    }

    .glbl {
      font-size: 5px;
      color: #1e5530;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-right: 4px;
    }

    .axbtn {
      width: 32px; height: 32px;
      font-size: 8px;
      padding: 0;
      color: #1e5530;
      border-color: #0d2e1a;
      box-shadow: 2px 2px 0 #001a0d;
    }
    .axbtn.active { color: #fff; }
    .axbtn.active-x {
      background: #200000; border-color: #ff3333; color: #ff4444;
      text-shadow: 0 0 8px #ff3333;
      box-shadow: 2px 2px 0 #2a0000, 0 0 10px rgba(255,40,40,0.3);
    }
    .axbtn.active-y {
      background: #002000; border-color: #33ff33; color: #44ff44;
      text-shadow: 0 0 8px #33ff33;
      box-shadow: 2px 2px 0 #002a00, 0 0 10px rgba(40,255,40,0.3);
    }
    .axbtn.active-z {
      background: #000020; border-color: #3366ff; color: #4477ff;
      text-shadow: 0 0 8px #3366ff;
      box-shadow: 2px 2px 0 #00002a, 0 0 10px rgba(40,80,255,0.3);
    }
    .axbtn:hover:not(.active) { color: #00cc55; border-color: #144d28; }

    #slice-lbl {
      min-width: 44px;
      text-align: center;
      font-size: 8px;
      color: #00ff66;
      text-shadow: 0 0 6px rgba(0,255,100,0.5);
    }

    #btn-prev, #btn-next {
      width: 28px; height: 28px;
      padding: 0; font-size: 9px;
      color: #1e5530;
    }
    #btn-prev:hover, #btn-next:hover { color: #00ff66; }

    .nbtn {
      width: 36px; height: 36px;
      font-size: 11px;
      padding: 0;
      color: #aaffcc;
      box-shadow: 2px 2px 0 #001a0d;
    }
    .nbtn:hover { background: #091a10; border-color: #00ff66; color: #00ff66; text-shadow: 0 0 8px #00ff66; }

    #btn-clr {
      width: 36px; height: 36px;
      padding: 0; font-size: 9px;
      color: #ff4444;
      border-color: #300000;
      box-shadow: 2px 2px 0 #1a0000;
    }
    #btn-clr:hover { background: #150000; border-color: #ff4444; text-shadow: 0 0 8px #ff4444; }

    /* ── loading ── */
    #loading {
      display: none;
      position: fixed; inset: 0;
      background: rgba(5,10,14,0.92);
      z-index: 100;
      flex-direction: column;
      align-items: center; justify-content: center;
      gap: 20px;
      font-size: 8px;
      color: #00ff66;
      text-shadow: 0 0 10px #00ff66;
      letter-spacing: 2px;
    }

    .spin {
      width: 28px; height: 28px;
      background: #00ff66;
      box-shadow: 0 0 16px #00ff66, 0 0 32px rgba(0,255,100,0.3);
      animation: pixelSpin 0.5s steps(4) infinite;
    }

    @keyframes pixelSpin {
      0%   { transform: rotate(0deg)   scale(1); }
      25%  { transform: rotate(90deg)  scale(0.75); }
      50%  { transform: rotate(180deg) scale(1); }
      75%  { transform: rotate(270deg) scale(0.75); }
    }

    /* ── win overlay ── */
    #win {
      display: none;
      position: fixed; inset: 0;
      background: rgba(5,10,14,0.88);
      z-index: 50;
      align-items: center; justify-content: center;
    }

    #win-card {
      background: #050a0e;
      border: 3px solid #00ff66;
      padding: 40px 48px;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
      box-shadow: 6px 6px 0 #002a10, 0 0 40px rgba(0,255,100,0.25), inset 0 0 20px rgba(0,255,100,0.04);
    }

    .win-icon {
      font-size: 10px;
      color: #00ff66;
      text-shadow: 0 0 12px #00ff66, 0 0 30px rgba(0,255,100,0.4);
      letter-spacing: 2px;
      animation: winPulse 0.8s steps(2) infinite;
    }

    @keyframes winPulse {
      0%,100% { opacity: 1; text-shadow: 0 0 12px #00ff66, 0 0 30px rgba(0,255,100,0.4); }
      50%     { opacity: 0.6; text-shadow: 0 0 4px #00ff66; }
    }

    #win-card h2 {
      font-size: 10px;
      color: #00ff66;
      letter-spacing: 2px;
      text-shadow: 0 0 8px rgba(0,255,100,0.5);
    }

    #win-card p { color: #1e6640; font-size: 7px; letter-spacing: 1px; }

    #btn-again {
      margin-top: 8px;
      background: #002a10;
      border-color: #00ff66;
      color: #00ff66;
      font-size: 8px;
      padding: 10px 22px;
      box-shadow: 4px 4px 0 #001a0d, 0 0 12px rgba(0,255,100,0.25);
    }
    #btn-again:hover { background: #003d18; box-shadow: 4px 4px 0 #002a10, 0 0 20px rgba(0,255,100,0.5); }

    /* ── timer ── */
    #timer {
      font-size: 10px;
      color: #00ff66;
      text-shadow: 0 0 8px rgba(0,255,100,0.6);
      letter-spacing: 2px;
      min-width: 60px;
      text-align: center;
    }

    /* ── fx canvas overlay ── */
    #fx {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 10;
    }

    /* ── responsive ── */
    @media (max-width: 500px) {
      .title { font-size: 9px; }
      .nbtn, #btn-clr { width: 32px; height: 32px; font-size: 9px; }
      .axbtn { width: 28px; height: 28px; font-size: 7px; }
      #win-card { padding: 28px 22px; }
      select, button { font-size: 6px; }
      #timer { font-size: 8px; }
    }
  </style>
</head>
<body>

  <div id="container"></div>
  <canvas id="fx"></canvas>

  <p id="info">[ click cell ] [ 1-4 ] [ arrows = slice ]</p>

  <div id="ui">
    <div id="top-bar">
      <span class="title">SUDOKUBE</span>
      <span id="timer">00:00</span>
      <select id="sel-diff">
        <option value="easy">Easy</option>
        <option value="medium" selected>Medium</option>
        <option value="hard">Hard</option>
      </select>
      <button id="btn-new">New Game</button>
    </div>

    <div id="ctrls">
      <div class="grp">
        <span class="glbl">Axis</span>
        <button id="btn-x" class="axbtn">X</button>
        <button id="btn-y" class="axbtn">Y</button>
        <button id="btn-z" class="axbtn active">Z</button>
      </div>
      <div class="grp">
        <span class="glbl">Slice</span>
        <button id="btn-prev">&#9664;</button>
        <span id="slice-lbl">1 / 4</span>
        <button id="btn-next">&#9654;</button>
      </div>
      <div class="grp">
        <span class="glbl">Fill</span>
        <button class="nbtn" data-n="1">1</button>
        <button class="nbtn" data-n="2">2</button>
        <button class="nbtn" data-n="3">3</button>
        <button class="nbtn" data-n="4">4</button>
        <button id="btn-clr">DEL</button>
      </div>
    </div>
  </div>

  <div id="loading">
    <div class="spin"></div>
    <span>Loading...</span>
  </div>

  <div id="win">
    <div id="win-card">
      <div class="win-icon">** WIN **</div>
      <h2>Puzzle Solved!</h2>
      <p id="win-time">Time: 00:00</p>
      <button id="btn-again">Play Again</button>
    </div>
  </div>

  <script type="module">
    import * as THREE from 'three';

    // ═══════════════════════════════════════════════════════════
    // SECTION 1 · SUDOKU LOGIC  (ported from generator.py)
    // ═══════════════════════════════════════════════════════════

    function make3(v = 0) {
      return Array.from({ length: 4 }, () =>
        Array.from({ length: 4 }, () => Array(4).fill(v)));
    }

    function copy3(g) {
      return g.map(a => a.map(b => [...b]));
    }

    function shuffle(a) {
      for (let i = a.length - 1; i > 0; i--) {
        const j = (Math.random() * (i + 1)) | 0;
        [a[i], a[j]] = [a[j], a[i]];
      }
      return a;
    }

    /** True if num can be placed at (x,y,z) — identical logic to is_valid() in generator.py */
    function isValid(g, x, y, z, n) {
      // Axis checks
      for (let i = 0; i < 4; i++) {
        if (g[i][y][z] === n) return false; // X-axis
        if (g[x][i][z] === n) return false; // Y-axis
        if (g[x][y][i] === n) return false; // Z-axis
      }
      // 2×2 subgrid on XY plane (fixed z)
      const sx = (x >> 1) << 1, sy = (y >> 1) << 1, sz = (z >> 1) << 1;
      for (let a = sx; a < sx + 2; a++)
        for (let b = sy; b < sy + 2; b++)
          if (g[a][b][z] === n) return false;
      // 2×2 subgrid on XZ plane (fixed y)
      for (let a = sx; a < sx + 2; a++)
        for (let c = sz; c < sz + 2; c++)
          if (g[a][y][c] === n) return false;
      // 2×2 subgrid on YZ plane (fixed x)
      for (let b = sy; b < sy + 2; b++)
        for (let c = sz; c < sz + 2; c++)
          if (g[x][b][c] === n) return false;
      return true;
    }

    function solveGrid(g) {
      for (let x = 0; x < 4; x++)
        for (let y = 0; y < 4; y++)
          for (let z = 0; z < 4; z++)
            if (g[x][y][z] === 0) {
              for (const n of shuffle([1, 2, 3, 4])) {
                if (isValid(g, x, y, z, n)) {
                  g[x][y][z] = n;
                  if (solveGrid(g)) return true;
                  g[x][y][z] = 0;
                }
              }
              return false;
            }
      return true;
    }

    function genSolution() {
      const g = make3(0);
      solveGrid(g);
      return g;
    }

    /** Count solutions up to `max`; uses step-limit to stay fast */
    function countSols(g, max = 2) {
      let count = 0, steps = 0;
      function s(h) {
        if (count >= max || steps > 90000) return;
        for (let x = 0; x < 4; x++)
          for (let y = 0; y < 4; y++)
            for (let z = 0; z < 4; z++)
              if (h[x][y][z] === 0) {
                for (let n = 1; n <= 4; n++)
                  if (isValid(h, x, y, z, n)) {
                    h[x][y][z] = n; steps++;
                    s(h);
                    h[x][y][z] = 0;
                  }
                return;
              }
        count++;
      }
      s(copy3(g));
      return count;
    }

    /** Remove cells from solution while keeping a unique solution */
    function makePuzzle(sol, diff) {
      const targets = { easy: 18, medium: 32, hard: 46 };
      const target  = targets[diff] ?? 32;
      const puzzle  = copy3(sol);
      const cells   = [];
      for (let x = 0; x < 4; x++)
        for (let y = 0; y < 4; y++)
          for (let z = 0; z < 4; z++)
            cells.push([x, y, z]);
      shuffle(cells);
      let removed = 0;
      for (const [x, y, z] of cells) {
        if (removed >= target) break;
        const bak = puzzle[x][y][z];
        puzzle[x][y][z] = 0;
        if (countSols(puzzle) === 1) {
          removed++;
        } else {
          puzzle[x][y][z] = bak; // restore — removal broke uniqueness
        }
      }
      return puzzle;
    }

    /** Return set of keys "x,y,z" whose values conflict with another cell */
    function getConflicts(player) {
      const bad = new Set();
      const c   = copy3(player);
      for (let x = 0; x < 4; x++)
        for (let y = 0; y < 4; y++)
          for (let z = 0; z < 4; z++) {
            const v = c[x][y][z];
            if (!v) continue;
            c[x][y][z] = 0;
            if (!isValid(c, x, y, z, v)) bad.add(`${x},${y},${z}`);
            c[x][y][z] = v;
          }
      return bad;
    }

    // ═══════════════════════════════════════════════════════════
    // SECTION 2 · GAME STATE
    // ═══════════════════════════════════════════════════════════

    // ── Timer ──
    let timerStart = 0, timerInterval = null;
    function startTimer() {
      timerStart = Date.now();
      clearInterval(timerInterval);
      timerInterval = setInterval(updateTimerDisplay, 500);
      updateTimerDisplay();
    }
    function stopTimer() { clearInterval(timerInterval); timerInterval = null; }
    function formatTime(ms) {
      const s = Math.floor(ms / 1000);
      return `${String(Math.floor(s/60)).padStart(2,'0')}:${String(s%60).padStart(2,'0')}`;
    }
    function updateTimerDisplay() {
      document.getElementById('timer').textContent = formatTime(Date.now() - timerStart);
    }

    const S = {
      sol:    null,   // [4][4][4] complete solution
      clues:  null,   // [4][4][4] bool  – immutable given cells
      player: null,   // [4][4][4] int   – player entries (0 = blank)
      axis:   'z',    // 'x' | 'y' | 'z'
      slice:  0,      // 0-3
      sel:    null,   // {x,y,z} | null
      diff:   'medium',
      solved: false
    };

    function newGame() {
      S.solved = false;
      S.sel    = null;

      S.sol   = genSolution();
      const p = makePuzzle(S.sol, S.diff);

      S.clues  = make3(false);
      S.player = make3(0);

      for (let x = 0; x < 4; x++)
        for (let y = 0; y < 4; y++)
          for (let z = 0; z < 4; z++)
            if (p[x][y][z]) {
              S.clues[x][y][z]  = true;
              S.player[x][y][z] = p[x][y][z];
            }

      celebratedGroups.clear();
      conflictsDirty = true;
      setAxis('z');
      redraw();
      syncUI();
      startTimer();
    }

    // ═══════════════════════════════════════════════════════════
    // SECTION 3 · THREE.JS SCENE
    // ═══════════════════════════════════════════════════════════

    // Per-axis color palettes  (face, clue-face, edge hex)
    const AXIS_CLR = {
      x: { face: 0x8b1a1a, clueFace: 0x6b1010, edge: 0xe05555 },
      y: { face: 0x1a6b22, clueFace: 0x0f4a18, edge: 0x44c45a },
      z: { face: 0x1d5fa0, clueFace: 0x1a4a88, edge: 0x4488cc },
    };
    const AXIS_CSS = { x: '#e05555', y: '#44c45a', z: '#4488cc' };

    const SP         = 1.0;  // centre-to-centre spacing within a 2×2 group
    const CS         = 0.9;  // cube side length (gap within group ≈ 0.10)
    const BLOCK_GAP  = 0.05; // extra separation between the two 2×2 groups per axis
    // → gap between groups ≈ 0.65, vs 0.10 within — visually distinct

    /** Position on one axis, inserting the block gap between cells 1 and 2 */
    function bp(i) { return (i - 1.5) * SP + (i >= 2 ? BLOCK_GAP * 0.5 : -BLOCK_GAP * 0.5); }

    let rndr, scene, cam, pivot;
    const meshes   = {}; // key → THREE.Mesh (cell face)
    const eLines   = {}; // key → THREE.LineSegments (cell edges)
    // faceData[key] = [{mat, ctx, tex}, …] for +Z, +X, +Y faces
    const faceData = {};
    const rc     = new THREE.Raycaster();
    const pt     = new THREE.Vector2();

    const isMobile = ('ontouchstart' in window) || (navigator.maxTouchPoints > 0);

    /**
     * Compute orthographic half-height so the full cube is always visible.
     * Cube isometric vertical half-extent ≈ 3.1 world units.
     * On portrait the horizontal axis is the bottleneck.
     */
    function computeViewSize() {
      const a = innerWidth / innerHeight;
      const forHoriz = 2.8 / Math.min(a, 1.0);
      return Math.max(forHoriz, 3.8);
    }

    /**
     * Shift the frustum UP so the cube sits above the bottom toolbar.
     * uiEl height in px → convert to world units.
     */
    function computeVShift(s) {
      const uiH = document.getElementById('ui').getBoundingClientRect().height || 110;
      // fraction of canvas taken by the toolbar
      const frac = uiH / innerHeight;
      // shift the frustum centre up by half that fraction (in world units)
      return frac * s;
    }

    function initThree() {
      const con = document.getElementById('container');

      rndr = new THREE.WebGLRenderer({ antialias: !isMobile });
      rndr.setPixelRatio(Math.min(devicePixelRatio, isMobile ? 1.5 : 2));
      rndr.setSize(innerWidth, innerHeight);
      rndr.setClearColor(0x050a0e);
      con.appendChild(rndr.domElement);

      scene = new THREE.Scene();

      const a = innerWidth / innerHeight;
      const s = computeViewSize();
      const vs = computeVShift(s);
      cam = new THREE.OrthographicCamera(-a * s, a * s, s + vs, -s + vs, -50, 50);
      cam.position.set(7, 7, 7);
      cam.lookAt(0, 0, 0);

      pivot = new THREE.Group(); // no rotation — iso camera shows all faces
      scene.add(pivot);

      // Shared geometries
      const bGeo = new THREE.BoxGeometry(CS, CS, CS);
      const eGeo = new THREE.EdgesGeometry(bGeo);

      for (let x = 0; x < 4; x++)
        for (let y = 0; y < 4; y++)
          for (let z = 0; z < 4; z++) {
            const k   = `${x},${y},${z}`;
            const pos = new THREE.Vector3(bp(x), bp(y), bp(z));

            // ── Cell face mesh ──
            const mesh = new THREE.Mesh(
              bGeo,
              new THREE.MeshBasicMaterial({
                color:      0x252a36,
                transparent: true,
                opacity:    0.06,
                depthWrite: false
              })
            );
            mesh.position.copy(pos);
            mesh.userData = { x, y, z, k };
            pivot.add(mesh);
            meshes[k] = mesh;

            // ── Cell edge lines ──
            const el = new THREE.LineSegments(
              eGeo,
              new THREE.LineBasicMaterial({
                color:       0x253646,
                transparent: true,
                opacity:     0.28
              })
            );
            mesh.add(el);
            eLines[k] = el;

            // ── Face planes (dice-style numbers) ──
            // Three planes on the three camera-facing faces: +Z, +X, +Y
            const FACE_DEFS = [
              { pos: [0,       0,       CS/2+.003], rot: [0, 0, 0]             },  // +Z
              { pos: [CS/2+.003, 0,     0        ], rot: [0, Math.PI/2, 0]     },  // +X
              { pos: [0,       CS/2+.003, 0      ], rot: [-Math.PI/2, 0, 0]    },  // +Y
            ];
            const pGeo = new THREE.PlaneGeometry(CS * 0.82, CS * 0.82);
            faceData[k] = FACE_DEFS.map(({ pos, rot }) => {
              const canvas = document.createElement('canvas');
              canvas.width = canvas.height = 128; // 4× fewer pixels than 256
              const ctx = canvas.getContext('2d');
              const tex = new THREE.CanvasTexture(canvas);
              const mat = new THREE.MeshBasicMaterial({
                map: tex, transparent: true, opacity: 0,
                depthWrite: false, side: THREE.FrontSide
              });
              const plane = new THREE.Mesh(pGeo, mat);
              plane.position.set(...pos);
              plane.rotation.set(...rot);
              mesh.add(plane);
              return { mat, ctx, tex };
            });
          }

      // ── 2×2 group border frames ──────────────────────────────
      // Each 4×4 slice has four 2×2 sub-blocks. We draw one thin
      // wireframe box per block (spanning both cells) so the groups
      // are visible even on inactive slices.
      buildBlockFrames();

      // Events
      con.addEventListener('pointerdown', onClick);
      document.addEventListener('keydown', onKey);
      window.addEventListener('resize', onResize);
    }

    // Stores the 3×4 sets of block-frame lines: blockFrames[axis][slice][blockIdx]
    const blockFrames = { x: [], y: [], z: [] };

    function buildBlockFrames() {
      // Half-size of a 2×2 block group (centre-to-edge including cell body)
      const half = SP * 0.5 + CS * 0.5;   // from group centre to outer edge
      const bGeo = new THREE.BoxGeometry(1, 1, 1); // scaled per frame
      const eGeo = new THREE.EdgesGeometry(bGeo);

      // For each axis, each of the 4 slices has four 2×2 blocks (bi,bj ∈ {0,1})
      ['x','y','z'].forEach(axis => {
        blockFrames[axis] = [];
        for (let si = 0; si < 4; si++) {         // slice index
          const frames = [];
          for (let bi = 0; bi < 2; bi++) {        // block row
            for (let bj = 0; bj < 2; bj++) {      // block col
              // Centre of this 2×2 group in the two "free" axes
              // Group 0 → cells 0,1 → centre at bp(0)+bp(1))/2
              // Group 1 → cells 2,3 → centre at (bp(2)+bp(3))/2
              const c0 = (bp(bi * 2) + bp(bi * 2 + 1)) / 2;
              const c1 = (bp(bj * 2) + bp(bj * 2 + 1)) / 2;
              const cs = bp(si); // position along the slice axis

              let px, py, pz, sx, sy, sz;
              if (axis === 'z') { px=c0; py=c1; pz=cs; sx=2*half; sy=2*half; sz=CS; }
              else if (axis === 'x') { px=cs; py=c0; pz=c1; sx=CS; sy=2*half; sz=2*half; }
              else               { px=c0; py=cs; pz=c1; sx=2*half; sy=CS; sz=2*half; }

              const mat = new THREE.LineBasicMaterial({
                color: 0x4a5568, transparent: true, opacity: 0.0
              });
              const frame = new THREE.LineSegments(eGeo, mat);
              frame.position.set(px, py, pz);
              frame.scale.set(sx, sy, sz);
              pivot.add(frame);
              frames.push(frame);
            }
          }
          blockFrames[axis].push(frames);
        }
      });
    }

    // ═══════════════════════════════════════════════════════════
    // SECTION 4 · VISUALS
    // ═══════════════════════════════════════════════════════════

    // Dirty render flag — only submit a GPU frame when something changed
    let needsRender = true;

    // Cached conflict set — recomputed only when the player grid changes
    let conflictsCache = new Set();
    let conflictsDirty = true;

    function getConflictsCached() {
      if (conflictsDirty) {
        conflictsCache = getConflicts(S.player);
        conflictsDirty = false;
      }
      return conflictsCache;
    }

    function inSlice(x, y, z) {
      return (S.axis === 'x' && x === S.slice) ||
             (S.axis === 'y' && y === S.slice) ||
             (S.axis === 'z' && z === S.slice);
    }

    const CANVAS_W = 128;

    /** Draw a number on a face canvas. Pass num=0 to clear. */
    function drawFace(ctx, tex, num, color, glowColor) {
      ctx.clearRect(0, 0, CANVAS_W, CANVAS_W);
      if (num > 0) {
        ctx.font = `bold ${CANVAS_W * 0.72}px "Courier New", monospace`;
        ctx.textAlign    = 'center';
        ctx.textBaseline = 'middle';
        // drop shadow for depth
        ctx.shadowOffsetX = 0; ctx.shadowOffsetY = 0;
        ctx.shadowColor = 'rgba(0,0,0,0.85)';
        ctx.shadowBlur  = 18;
        ctx.fillStyle   = color;
        ctx.fillText(String(num), CANVAS_W / 2, CANVAS_W / 2 + 8);
        // optional glow pass
        if (glowColor) {
          ctx.shadowColor = glowColor;
          ctx.shadowBlur  = 28;
          ctx.fillText(String(num), CANVAS_W / 2, CANVAS_W / 2 + 8);
        }
        ctx.shadowBlur = 0;
      }
      tex.needsUpdate = true;
    }

    function redraw() {
      if (!S.player) return;
      const bad = getConflictsCached();
      const ac  = AXIS_CLR[S.axis];
      needsRender = true;

      // ── Orthogonal preview: cells along the axis-line through the selected cell ──
      const previewKeys = new Set();
      if (S.sel) {
        const { x: sx, y: sy, z: sz } = S.sel;
        for (let i = 0; i < 4; i++) {
          if (S.axis === 'z') previewKeys.add(`${sx},${sy},${i}`);
          else if (S.axis === 'x') previewKeys.add(`${i},${sy},${sz}`);
          else                     previewKeys.add(`${sx},${i},${sz}`);
        }
        // Remove the active-slice cell itself (already shown normally)
        previewKeys.delete(`${sx},${sy},${sz}`);
      }

      // ── Block frame visibility ──
      ['x','y','z'].forEach(axis => {
        blockFrames[axis].forEach((sliceFrames, si) => {
          const isActive = axis === S.axis && si === S.slice;
          sliceFrames.forEach(f => {
            f.material.color.setHex(isActive ? AXIS_CLR[axis].edge : 0x2d3748);
            f.material.opacity = isActive ? 0.85 : 0.12;
          });
        });
      });

      for (let x = 0; x < 4; x++)
        for (let y = 0; y < 4; y++)
          for (let z = 0; z < 4; z++) {
            const k       = `${x},${y},${z}`;
            const mat     = meshes[k].material;
            const eMat    = eLines[k].material;
            const v       = S.player[x][y][z];
            const act     = inSlice(x, y, z);
            const sel     = S.sel && S.sel.x === x && S.sel.y === y && S.sel.z === z;
            const clue    = S.clues[x][y][z];
            const err     = bad.has(k);
            const preview = previewKeys.has(k);

            // ── Cell face colour ──
            if (sel) {
              mat.color.setHex(0x00ccaa); mat.opacity = 1.0;
            } else if (act && err) {
              mat.color.setHex(0xcc2222); mat.opacity = 1.0;
            } else if (act && clue) {
              mat.color.setHex(ac.clueFace); mat.opacity = 1.0;
            } else if (act) {
              mat.color.setHex(ac.face); mat.opacity = 1.0;
            } else if (preview) {
              mat.color.setHex(0x1a2a1a); mat.opacity = 0.35;
            } else {
              mat.color.setHex(0x252a36); mat.opacity = 0.06;
            }

            // ── Edge colour ──
            if (act) {
              eMat.color.setHex(ac.edge); eMat.opacity = 0.75;
            } else if (preview) {
              eMat.color.setHex(0x2a6040); eMat.opacity = 0.5;
            } else {
              eMat.color.setHex(0x253646); eMat.opacity = 0.22;
            }

            // ── Dice-face numbers ──
            const color = err  ? '#f87171' : clue ? '#93c5fd' : '#ffd060';
            const glow  = err  ? '#f8717166' : clue ? null : '#ffd06055';
            faceData[k].forEach(({ mat: fm, ctx, tex }) => {
              if (v > 0 && act) {
                fm.opacity = 1.0;
                drawFace(ctx, tex, v, color, glow);
              } else if (v > 0 && preview) {
                fm.opacity = 0.38;
                drawFace(ctx, tex, v, '#66aa88', null);
              } else {
                fm.opacity = 0;
                drawFace(ctx, tex, 0, '', null);
              }
            });
          }
    }

    /** Switch active axis. If a cell is selected, jump to its slice on the new axis (feature 3). */
    function setAxis(axis) {
      S.axis  = axis;
      S.slice = S.sel ? S.sel[axis] : 0;
      // keep selection so the orthogonal preview updates for the new axis
    }

    // ═══════════════════════════════════════════════════════════
    // SECTION 5 · INTERACTION
    // ═══════════════════════════════════════════════════════════

    function onClick(e) {
      if (!S.player || S.solved) return;
      const rect = rndr.domElement.getBoundingClientRect();
      pt.x =  ((e.clientX - rect.left) / rect.width)  * 2 - 1;
      pt.y = -((e.clientY - rect.top)  / rect.height) * 2 + 1;
      rc.setFromCamera(pt, cam);
      const hits = rc.intersectObjects(Object.values(meshes));
      for (const h of hits) {
        const { x, y, z, k } = h.object.userData;
        if (!inSlice(x, y, z)) continue;
        // toggle selection
        if (S.sel && S.sel.x === x && S.sel.y === y && S.sel.z === z) {
          S.sel = null;
        } else {
          S.sel = { x, y, z };
        }
        redraw();
        return;
      }
      S.sel = null;
      redraw();
    }

    function fill(n) {
      if (!S.sel || S.solved) return;
      const { x, y, z } = S.sel;
      if (S.clues[x][y][z]) return;
      S.player[x][y][z] = n;
      conflictsDirty = true;
      redraw();
      checkCompletions(x, y, z);
      checkWin();
    }

    function clrCell() {
      if (!S.sel) return;
      const { x, y, z } = S.sel;
      if (S.clues[x][y][z]) return;
      S.player[x][y][z] = 0;
      conflictsDirty = true;
      redraw();
    }

    function checkWin() {
      for (let x = 0; x < 4; x++)
        for (let y = 0; y < 4; y++)
          for (let z = 0; z < 4; z++)
            if (!S.player[x][y][z]) return;
      if (getConflicts(S.player).size > 0) return;
      S.solved = true;
      stopTimer();
      const elapsed = formatTime(Date.now() - timerStart);
      document.getElementById('win-time').textContent = `Time: ${elapsed}`;
      burstAll();
      setTimeout(() => { document.getElementById('win').style.display = 'flex'; }, 1200);
    }

    /** Check if any new lines/columns/axes/boxes/slices just completed and fire particles */
    function checkCompletions(x, y, z) {
      const bad = getConflicts(S.player);

      function groupComplete(cells) {
        return cells.every(([cx,cy,cz]) => S.player[cx][cy][cz] > 0 && !bad.has(`${cx},${cy},${cz}`));
      }

      // Build list of group keys + world-space centre positions to celebrate
      const toFire = [];

      // X-lines (y,z fixed)
      {
        const key = `xl_${y}_${z}`;
        if (!celebratedGroups.has(key) && groupComplete([[0,y,z],[1,y,z],[2,y,z],[3,y,z]])) {
          celebratedGroups.add(key);
          toFire.push(worldCentre([0,y,z],[3,y,z]));
        }
      }
      // Y-lines (x,z fixed)
      {
        const key = `yl_${x}_${z}`;
        if (!celebratedGroups.has(key) && groupComplete([[x,0,z],[x,1,z],[x,2,z],[x,3,z]])) {
          celebratedGroups.add(key);
          toFire.push(worldCentre([x,0,z],[x,3,z]));
        }
      }
      // Z-lines (x,y fixed)
      {
        const key = `zl_${x}_${y}`;
        if (!celebratedGroups.has(key) && groupComplete([[x,y,0],[x,y,1],[x,y,2],[x,y,3]])) {
          celebratedGroups.add(key);
          toFire.push(worldCentre([x,y,0],[x,y,3]));
        }
      }
      // Z-slice (all 16 cells at z)
      {
        const cells = []; for(let a=0;a<4;a++) for(let b=0;b<4;b++) cells.push([a,b,z]);
        const key = `zs_${z}`;
        if (!celebratedGroups.has(key) && groupComplete(cells)) {
          celebratedGroups.add(key);
          toFire.push(worldCentre([0,0,z],[3,3,z]));
        }
      }
      // X-slice
      {
        const cells = []; for(let b=0;b<4;b++) for(let c=0;c<4;c++) cells.push([x,b,c]);
        const key = `xs_${x}`;
        if (!celebratedGroups.has(key) && groupComplete(cells)) {
          celebratedGroups.add(key);
          toFire.push(worldCentre([x,0,0],[x,3,3]));
        }
      }
      // Y-slice
      {
        const cells = []; for(let a=0;a<4;a++) for(let c=0;c<4;c++) cells.push([a,y,c]);
        const key = `ys_${y}`;
        if (!celebratedGroups.has(key) && groupComplete(cells)) {
          celebratedGroups.add(key);
          toFire.push(worldCentre([0,y,0],[3,y,3]));
        }
      }
      // 2x2 boxes on each plane
      const bx = (x>>1)<<1, by = (y>>1)<<1, bz = (z>>1)<<1;
      // XY box at fixed z
      {
        const cells = [[bx,by,z],[bx+1,by,z],[bx,by+1,z],[bx+1,by+1,z]];
        const key = `bxy_${bx}_${by}_${z}`;
        if (!celebratedGroups.has(key) && groupComplete(cells)) {
          celebratedGroups.add(key);
          toFire.push(worldCentre([bx,by,z],[bx+1,by+1,z]));
        }
      }
      // XZ box at fixed y
      {
        const cells = [[bx,y,bz],[bx+1,y,bz],[bx,y,bz+1],[bx+1,y,bz+1]];
        const key = `bxz_${bx}_${y}_${bz}`;
        if (!celebratedGroups.has(key) && groupComplete(cells)) {
          celebratedGroups.add(key);
          toFire.push(worldCentre([bx,y,bz],[bx+1,y,bz+1]));
        }
      }
      // YZ box at fixed x
      {
        const cells = [[x,by,bz],[x,by+1,bz],[x,by,bz+1],[x,by+1,bz+1]];
        const key = `byz_${x}_${by}_${bz}`;
        if (!celebratedGroups.has(key) && groupComplete(cells)) {
          celebratedGroups.add(key);
          toFire.push(worldCentre([x,by,bz],[x,by+1,bz+1]));
        }
      }

      toFire.forEach(([wx, wy]) => spawnStars(wx, wy));
    }

    /** World-space centre of two 3D grid cells, projected to screen XY */
    function worldCentre([ax,ay,az],[bx,by,bz]) {
      const wx = (bp(ax)+bp(bx))/2, wy = (bp(ay)+bp(by))/2, wz = (bp(az)+bp(bz))/2;
      const v = new THREE.Vector3(wx, wy, wz);
      v.project(cam);
      const sx = (v.x * 0.5 + 0.5) * innerWidth;
      const sy = (-v.y * 0.5 + 0.5) * innerHeight;
      return [sx, sy];
    }

    function chSlice(d) {
      S.slice = ((S.slice + d) % 4 + 4) % 4;
      S.sel   = null;
      redraw();
      syncUI();
    }

    function onKey(e) {
      if (e.metaKey || e.ctrlKey || S.solved) return;
      const k = e.key;
      if ('1234'.includes(k) && k.length === 1) { e.preventDefault(); fill(+k); }
      else if (k === 'Backspace' || k === 'Delete') { e.preventDefault(); clrCell(); }
      else if (k === 'ArrowRight' || k === 'ArrowUp')   { e.preventDefault(); chSlice(+1); }
      else if (k === 'ArrowLeft'  || k === 'ArrowDown')  { e.preventDefault(); chSlice(-1); }
      else if (k === 'x' || k === 'X') setAxisAndSync('x');
      else if (k === 'y' || k === 'Y') setAxisAndSync('y');
      else if (k === 'z' || k === 'Z') setAxisAndSync('z');
    }

    function setAxisAndSync(a) { setAxis(a); redraw(); syncUI(); }

    // ═══════════════════════════════════════════════════════════
    // SECTION 6 · UI HELPERS
    // ═══════════════════════════════════════════════════════════

    function syncUI() {
      ['x', 'y', 'z'].forEach(a => {
        const btn = document.getElementById(`btn-${a}`);
        btn.classList.toggle('active',   S.axis === a);
        btn.classList.toggle('active-x', S.axis === a && a === 'x');
        btn.classList.toggle('active-y', S.axis === a && a === 'y');
        btn.classList.toggle('active-z', S.axis === a && a === 'z');
      });
      const lbl = document.getElementById('slice-lbl');
      lbl.textContent = `${S.slice + 1} / 4`;
      lbl.style.color = AXIS_CSS[S.axis];
    }

    function onResize() {
      const a  = innerWidth / innerHeight;
      const s  = computeViewSize();
      const vs = computeVShift(s);
      cam.left   = -a * s;
      cam.right  =  a * s;
      cam.top    =  s + vs;
      cam.bottom = -s + vs;
      cam.updateProjectionMatrix();
      rndr.setSize(innerWidth, innerHeight);
      resizeFx();
      needsRender = true;
    }

    function showLoading(v) {
      document.getElementById('loading').style.display = v ? 'flex' : 'none';
    }

    // ═══════════════════════════════════════════════════════════
    // SECTION 7 · PARTICLE FX
    // ═══════════════════════════════════════════════════════════

    const celebratedGroups = new Set();

    // Pixel-art star particles rendered on a 2D canvas overlay (#fx)
    const fxCanvas = document.getElementById('fx');
    const fxCtx    = fxCanvas.getContext('2d');
    let   particles = [];

    function resizeFx() {
      fxCanvas.width  = innerWidth;
      fxCanvas.height = innerHeight;
    }

    // Retro pixel palette
    const STAR_COLORS = ['#00ff66','#ffff00','#ff66aa','#66ffff','#ff9900','#ffffff'];

    function spawnStars(cx, cy) {
      const count = isMobile ? 12 : 22;
      for (let i = 0; i < count; i++) {
        const angle = (Math.PI * 2 * i) / count + (Math.random() - 0.5) * 0.5;
        const speed = 1.5 + Math.random() * 2.5;
        particles.push({
          x: cx, y: cy,
          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed - 1.5, // slight upward bias
          life: 1.0,
          decay: 0.018 + Math.random() * 0.012,
          size: (Math.random() < 0.5 ? 3 : 5), // pixel sizes: 3 or 5
          color: STAR_COLORS[Math.floor(Math.random() * STAR_COLORS.length)],
          // pixel star shape: 0=square, 1=plus cross
          shape: Math.random() < 0.4 ? 1 : 0,
        });
      }
    }

    function burstAll() {
      for (let x = 0; x < 4; x++)
        for (let y = 0; y < 4; y++)
          for (let z = 0; z < 4; z++) {
            const [sx, sy] = worldCentre([x,y,z],[x,y,z]);
            setTimeout(() => spawnStars(sx, sy), Math.random() * 600);
          }
    }

    function drawPixelStar(ctx, x, y, size, color, shape) {
      ctx.fillStyle = color;
      const px = Math.round(x), py = Math.round(y);
      if (shape === 0) {
        // solid pixel square
        ctx.fillRect(px - size/2, py - size/2, size, size);
      } else {
        // plus / cross
        ctx.fillRect(px - size/2, py - 1, size, 2);
        ctx.fillRect(px - 1, py - size/2, 2, size);
      }
    }

    function tickParticles() {
      if (particles.length === 0) return;
      fxCtx.clearRect(0, 0, fxCanvas.width, fxCanvas.height);
      particles = particles.filter(p => p.life > 0);
      for (const p of particles) {
        fxCtx.globalAlpha = Math.max(0, p.life);
        drawPixelStar(fxCtx, p.x, p.y, p.size, p.color, p.shape);
        p.x    += p.vx;
        p.y    += p.vy;
        p.vy   += 0.08;
        p.life -= p.decay;
      }
      fxCtx.globalAlpha = 1;
      if (particles.length === 0) fxCtx.clearRect(0, 0, fxCanvas.width, fxCanvas.height);
      needsRender = true;
    }

    // ═══════════════════════════════════════════════════════════
    // SECTION 8 · ANIMATION LOOP + INIT
    // ═══════════════════════════════════════════════════════════

    function loop() {
      requestAnimationFrame(loop);
      tickParticles();
      if (needsRender) {
        rndr.render(scene, cam);
        needsRender = false;
      }
    }

    function init() {
      resizeFx();
      initThree();

      // Axis buttons
      ['x', 'y', 'z'].forEach(a =>
        document.getElementById(`btn-${a}`).addEventListener('click', () =>
          setAxisAndSync(a)));

      // Slice buttons
      document.getElementById('btn-prev').addEventListener('click', () => chSlice(-1));
      document.getElementById('btn-next').addEventListener('click', () => chSlice(+1));

      // Number pad
      document.querySelectorAll('.nbtn').forEach(b =>
        b.addEventListener('click', () => fill(+b.dataset.n)));
      document.getElementById('btn-clr').addEventListener('click', clrCell);

      // New game
      document.getElementById('btn-new').addEventListener('click', () => {
        S.diff = document.getElementById('sel-diff').value;
        document.getElementById('win').style.display = 'none';
        showLoading(true);
        // Small delay so the loading UI has time to paint before the heavy compute
        setTimeout(() => { newGame(); showLoading(false); }, 60);
      });

      document.getElementById('btn-again').addEventListener('click', () =>
        document.getElementById('btn-new').click());

      loop();

      // First puzzle
      showLoading(true);
      setTimeout(() => { newGame(); showLoading(false); }, 60);
    }

    init();
  </script>
</body>
</html>
